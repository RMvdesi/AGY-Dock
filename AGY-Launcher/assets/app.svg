<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="chassis" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#1E2735" />
      <stop offset="55%" stop-color="#121822" />
      <stop offset="100%" stop-color="#090D14" />
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="glacier" x1="15%" y1="10%" x2="75%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DCE4EE" />
    </linearGradient>
    <linearGradient id="cobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="48%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Outer Precision Squircle Chassis -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#chassis)" />
  <rect x="23" y="23" width="466" height="466" rx="109" fill="none" stroke="url(#rim)" stroke-width="4" />

  <!-- Subtle Radial Specular Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="2" />

  <!-- Left Primary Blade: sweeps cleanly from rounded peak down to left base -->
  <path d="M 256 108
           C 242 108, 232 116, 224 132
           L 114 366
           C 110 374, 116 384, 126 384
           L 174 384
           C 182 384, 188 379, 192 371
           L 256 226
           Z" fill="url(#glacier)" />

  <!-- Right Modular Extension Blade (clean dark separation seam at apex, sweeps down to right leg) -->
  <path d="M 274 128
           L 398 366
           C 402 374, 396 384, 386 384
           L 338 384
           C 330 384, 324 379, 320 371
           L 264 244
           L 264 132
           C 264 124, 270 121, 274 128
           Z" fill="url(#cobalt)" />

  <!-- Clean Floating Crossbar Dock (isolated inside triangle with zero awkward overlap) -->
  <rect x="218" y="334" width="76" height="36" rx="18" fill="url(#cobalt)" />

  <!-- Live Emerald Precision Core nestled cleanly inside upper aperture -->
  <circle cx="256" cy="284" r="21" fill="url(#emerald)" />
</svg>
