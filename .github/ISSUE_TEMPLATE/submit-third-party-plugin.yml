name: 快捷上架第三方插件市场（自动筛查免审）
description: 填好 GitHub 仓库与插件名，自动代码安全筛查通过后免人工审核进入第三方市场
title: "[第三方插件上架] "
labels: ["plugin-third-party-submit"]
body:
  - type: markdown
    attributes:
      value: |
        提交后机器人将自动下载你仓库最新发布版本的 `.zip` 插件包并进行代码安全筛查：
        - **无风险**：直接免人工审核进入公共「第三方市场」。
        - **低危敏感行为**（如连接外部网址、请求管理器白名单清理子进程）：允许上架并在卡片标注提示。
        - **高危风险**（含 `.exe`、直接强杀系统进程、加密混淆等）：自动拦截，需改走「官方认证插件申请」人工审核。
  - type: input
    id: repo
    attributes:
      label: GitHub 仓库地址 (repo)
      description: 你的公开插件仓库地址（如 https://github.com/zhangsan/my-plugin）
      placeholder: "https://github.com/username/repo"
    validations:
      required: true
  - type: input
    id: plugin_name
    attributes:
      label: 插件名称 (plugin_name)
      description: 显示在第三方市场中的插件名称
      placeholder: "例如：子代理进程自动清理助手"
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: 作者展示名 (author)
      description: 可选，留空时默认使用仓库用户名
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: 一句话功能简介 (description)
      description: 简洁说明插件功能
    validations:
      required: false
