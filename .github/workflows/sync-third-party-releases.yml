name: Sync Approved Upstream Plugin Releases

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check upstream releases and run security scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-third-party-releases.mjs

      - name: Commit updated catalogs
        run: |
          git config user.name "agy-dock-bot"
          git config user.email "bot@haoanlab.xyz"
          git add plugins-catalog.json third-party-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(marketplace): sync upstream plugin releases"
            git push origin HEAD:main
          fi

      - name: Open review PRs for official high-risk updates
        if: hashFiles('sync-pending-official.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "agy-dock-bot"
          git config user.email "bot@haoanlab.xyz"
          COUNT=$(node -e "const a=JSON.parse(require('fs').readFileSync('sync-pending-official.json','utf8'));console.log(Array.isArray(a)?a.length:0)")
          for ((i=0; i<COUNT; i++)); do
            ID=$(node -e "const a=JSON.parse(require('fs').readFileSync('sync-pending-official.json','utf8'));console.log(a[$i].id)")
            VER=$(node -e "const a=JSON.parse(require('fs').readFileSync('sync-pending-official.json','utf8'));console.log(a[$i].toVersion)")
            REPO=$(node -e "const a=JSON.parse(require('fs').readFileSync('sync-pending-official.json','utf8'));console.log(a[$i].upstreamRepo)")
            SUMMARY=$(node -e "const a=JSON.parse(require('fs').readFileSync('sync-pending-official.json','utf8'));console.log(a[$i].scanReport.summary)")
            FINDINGS=$(node -e "const a=JSON.parse(require('fs').readFileSync('sync-pending-official.json','utf8'));console.log((a[$i].scanReport.findings||[]).map(f=>'- ['+f.severity+'] '+f.title+(f.file?' ('+f.file+')':'')+': '+f.detail).join('\n'))")
            BRANCH="plugin-sync/${ID//./-}-v${VER}"
            EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
            if [ "${EXISTING:-0}" -gt 0 ]; then
              echo "Skipping existing review PR for $BRANCH"
              continue
            fi
            git checkout -B "$BRANCH" origin/main
            SYNC_INDEX="$i" node -e "
              const fs = require('fs');
              const idxEnv = Number(process.env.SYNC_INDEX);
              const pending = JSON.parse(fs.readFileSync('sync-pending-official.json','utf8'))[idxEnv];
              const cat = JSON.parse(fs.readFileSync('plugins-catalog.json','utf8'));
              const idx = (cat.plugins || []).findIndex((p) => String(p.id || '').toLowerCase() === pending.id.toLowerCase());
              if (idx >= 0) {
                cat.plugins[idx] = pending.entry;
                cat.updatedAt = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
                fs.writeFileSync('plugins-catalog.json', JSON.stringify(cat, null, 2) + '\n', 'utf8');
              }
            "
            git add plugins-catalog.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(marketplace): review official plugin update ${ID} v${VER}"
              git push origin "$BRANCH" --force
              gh pr create --base main --head "$BRANCH" \
                --title "[人工复核 · 新版更新] ${ID} v${VER}" \
                --body "⚠️ **官方已收录插件发布了新版本，检测到高风险规则项，需人工复核后合并更新。**

- 插件 ID：\`${ID}\`
- 目标版本：\`v${VER}\`
- 上游仓库：https://github.com/${REPO}
- 筛查结论：${SUMMARY}

### 触发的风险项明细
${FINDINGS}

> 核对新版源码确认安全后点击 **Merge pull request** 即可更新到官方市场。"
            fi
            git checkout main
          done
